
<html >

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
            margin: auto;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        form {
            background-color: white;
            max-width: 800px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        fieldset {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        legend {
            color: #2563eb;
            font-weight: bold;
            padding: 0 10px;
        }

        legend h2 {
            font-size: 20px;
            margin: 0;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"],
        input[type="tel"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
        }

        input[type="radio"] {
            margin: 10px 5px 10px 15px;
        }

        input[type="file"] {
            margin-top: 8px;
            padding: 8px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 11px 25px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            color: white;
        }

        input[type="submit"] {
            background-color: #2563eb;
        }

        input[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        input[type="reset"] {
            background-color: #64748b;
        }

        input[type="reset"]:hover {
            background-color: #475569;
        }

        footer {
            text-align: center;
            color: #64748b;
            margin-top: 20px;
        }

        hr {
            border: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            form {
                padding: 15px;
            }

            header {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <center>
            <h1>Student Registration Form</h1>
            <p>Please fill in the details below to complete your registration.</p>
        </center>
    </header>

    <hr>

    <form onsubmit="return validatePassword()">

        <fieldset>
            <legend><h2>Personal Information</h2></legend>

            <label for="name">Student Name:</label><br>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your full name"
                   required>

            <br><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date"
                   id="dob"
                   name="dob"
                   required>

            <br><br>

            <label>Gender:</label><br>

            <input type="radio"
                   id="male"
                   name="gender"
                   value="male"
                   required>
            <label for="male">Male</label>

            <input type="radio"
                   id="female"
                   name="gender"
                   value="female">
            <label for="female">Female</label>

            <input type="radio"
                   id="other"
                   name="gender"
                   value="other">
            <label for="other">Other</label>

            <br><br>

            <label for="address">Address:</label><br>
            <textarea id="address"
                      name="address"
                      rows="4"
                      placeholder="Enter your complete address"
                      required></textarea>

        </fieldset>

        <fieldset>
            <legend><h2>Contact Information</h2></legend>

            <label for="phone">Phone Number:</label><br>
            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="Enter 10-digit phone number"
                   pattern="[0-9]{10}"
                   required>

            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="example@email.com"
                   required>

        </fieldset>

        <fieldset>
            <legend><h2>Educational Details</h2></legend>

            <label for="qualification">
                Educational Qualification:
            </label><br>

            <select id="qualification"
                    name="qualification"
                    required>

                <option value="">Select Qualification</option>
                <option value="10th">10th</option>
                <option value="12th">12th</option>
                <option value="diploma">Diploma</option>
                <option value="degree">Degree</option>
                <option value="post-graduation">
                    Post Graduation
                </option>

            </select>

            <br><br>

            <label for="course">Select Course:</label><br>

            <select id="course"
                    name="course"
                    required>

                <option value="">Select Course</option>
                <option value="bca">BCA</option>
                <option value="bba">BBA</option>
                <option value="bcom">B.Com</option>
                <option value="bsc">B.Sc Computer Science</option>
                <option value="mca">MCA</option>

            </select>

        </fieldset>

        <fieldset>
            <legend><h2>Account Details</h2></legend>

            <label for="password">Password:</label><br>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Create a password"
                   minlength="6"
                   required>

            <br><br>

            <label for="confirmPassword">
                Confirm Password:
            </label><br>

            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Confirm your password"
                   minlength="6"
                   required>

        </fieldset>

        <fieldset>
            <legend><h2>Documents</h2></legend>

            <label for="file">
                Upload Photo / Document:
            </label><br>

            <input type="file"
                   id="file"
                   name="file"
                   accept="image/*,.pdf">

            <br><br>

            <label for="tc_date">Date of TC:</label><br>

            <input type="date"
                   id="tc_date"
                   name="tc_date">

        </fieldset>

        <center>
            <input type="submit" value="Register">
            &nbsp;&nbsp;
            <input type="reset" value="Clear">
        </center>

    </form>

    <hr>

    <footer>
        <p>Student Registration Portal</p>
    </footer>

    <script>
        function validatePassword() {
            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return false;
            }

            alert("Registration successful!");
            return true;
        }
    </script>

</body>

</html>
