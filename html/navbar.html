<!DOCTYPE html>
<html>
<head>
    <title>Sidebar Navigation</title>

    <style>
        .sidenav a {
            display: block;
            text-decoration: none;
            padding: 8px 10px 8px 18px;
            color: white;
        }

        .sidenav {
            height: 100%;
            width: 160px;
            padding-top: 25px;
            background-color: green;
            position: fixed;
            top: 0;
            left: 0;
        }

        .sidenav a:hover {
            color: red;
        }

        .main {
            margin-left: 170px;
            padding: 0px 15px;
            height: 2000px;
        }
    </style>
</head>

<body>

    <div class="sidenav">
        <a href="#about">About us</a>
        <a href="#departments">Departments</a>
        <a href="#vision">Vision</a>
        <a href="#mission">Mission</a>
        <a href="#contact">Contact us</a>
    </div>

    <div class="main">
        <h1>Side Bar Example</h1>
    </div>

</body>
</html>
