<!DOCTYPE html>
<html>
<head>
    <title>Biodata Using Internal Style Sheet</title>

    <style>
        body 
        {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .biodata 
        {
            width: 70%;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 10px;
        }

        h1 
        {
            text-align: center;
            color: #1a4d80;
        }

        h2 
        {
            color: #1a4d80;
            border-bottom: 1px solid #1a4d80;
            padding-bottom: 5px;
        }

        table 
        {
            width: 100%;
            border-collapse: collapse;
        }

        td 
        {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        td:first-child 
        {
            font-weight: bold;
            width: 30%;
        }
    </style>
</head>

<body>

    <div class="biodata">

        <h1>BIODATA</h1>

        <h2>Personal Details</h2>

        <table>
            <tr>
                <td>Name</td>
                <td>Nandana</td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td>01 January 2005</td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>female</td>
            </tr>
            <tr>
                <td>Nationality</td>
                <td>Indian</td>
            </tr>
            <tr>
                <td>Address</td>
                <td>Kerala, India</td>
            </tr>
        </table>

        <h2>Educational Qualification</h2>

        <table>
            <tr>
                <td>Degree</td>
                <td>Bachelor of Computer Applications</td>
            </tr>
            <tr>
                <td>College</td>
                <td>ABC College</td>
            </tr>
            <tr>
                <td>Year of Passing</td>
                <td>2025</td>
            </tr>
        </table>

        <h2>Contact Details</h2>

        <table>
            <tr>
                <td>Email</td>
                <td>nandu1@email.com</td>
            </tr>
            <tr>
                <td>Phone</td>
                <td>9876543210</td>
            </tr>
        </table>

    </div>

</body>
</html>
