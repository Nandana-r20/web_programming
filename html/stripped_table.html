
<html>
<head>
    <title>Striped Table</title>

    <style>
        #studentTable {
            width: 70%;
            font-family: Arial, sans-serif;
            border-collapse: collapse;
        }

        #studentTable th {
            padding: 10px;
            text-align: left;
            background-color: grey;
            color: white;
            border: 1px solid black;
        }

        #studentTable td {
            padding: 10px;
            border: 1px solid black;
        }

        #studentTable tr {
            border: 1px solid black;
        }

        
        #studentTable tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        
        #studentTable tr:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <h2>Student Details</h2>

    <table id="studentTable">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Nandana</td>
            <td>20</td>
            <td>BCA</td>
        </tr>

        <tr>
            <td>Abhijith</td>
            <td>21</td>
            <td>btech</td>
        </tr>

        <tr>
            <td>Nayana</td>
            <td>20</td>
            <td>BBA</td>
        </tr>

        <tr>
            <td>Arya</td>
            <td>20</td>
            <td>Bcom</td>
        </tr>
    </table>

</body>
</html>
