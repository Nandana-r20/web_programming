<html>
<head>
<title>Mouse click events </title>
</head>
<body> 
<h2>mouse click events</h2>
<button onclick="changeRed()" ondblclick="changeGreen()">
Click Me
</button>

<script>
function changeRed(){
document.body.style.backgroundColor="red";
}
function changeGreen()
{
document.body.style.backgroundColor="green";
}
</script>
</body>
</html>
